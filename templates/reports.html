{% extends "base.html" %}{% block title %}Reports — PromptShield AI{% endblock %}
{% block content %}<div class="app-shell"><div class="app-header"><div><h1>Security Reports</h1><p>Generate a PDF from an actual audited request.</p></div></div><div class="glass-card app-panel"><input id="reportRequestId" class="text-input" placeholder="PS-2026-XXXXXXXX"><button class="btn btn-primary" id="generateReport">GENERATE REPORT</button><div id="reportStatus" class="empty-state">Enter a Request ID from History or Audit.</div></div></div>{% endblock %}
{% block extra_js %}<script>document.getElementById("generateReport").onclick=()=>{const id=document.getElementById("reportRequestId").value.trim(); if(id) window.open("/api/reports/"+encodeURIComponent(id),"_blank");};</script>{% endblock %}
