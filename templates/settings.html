{% extends "base.html" %}{% block title %}Settings — PromptShield AI{% endblock %}
{% block content %}<div class="app-shell"><div class="app-header"><div><h1>Security Settings</h1><p>Runtime policy controls. Secrets and private keys are never displayed.</p></div></div><div class="glass-card app-panel"><div id="settingsStatus">Loading…</div><div id="settingsForm" class="charts-grid"></div><button class="btn btn-primary" id="saveSettings">SAVE POLICY SETTINGS</button></div><div class="glass-card app-panel"><button class="btn btn-ghost" id="replayIntroBtn">Replay Boot Intro</button></div></div>{% endblock %}
{% block extra_js %}<script>
let settings={};
async function loadSettings(){
  const r=await fetch("/api/settings"); const x=await r.json(); settings=x.data||{};
  document.getElementById("settingsStatus").textContent=settings.offline_mode?"OFFLINE MODE":"PROVIDER ACTIVE";
  document.getElementById("settingsForm").innerHTML=`
    <label>Rule Weight <input id="rw" type="number" step=".05" value="${settings.rule_weight}"></label>
    <label>ML Weight <input id="mw" type="number" step=".05" value="${settings.ml_weight}"></label>
    <label>Judge Weight <input id="jw" type="number" step=".05" value="${settings.llm_judge_weight}"></label>
    <label>Defense Mode <select id="dm"><option>disabled</option><option>basic</option><option>standard</option><option>strict</option><option>maximum</option></select></label>
    <label>LLM Provider <select id="provider"><option value="mock">Mock</option><option value="gemini">Gemini</option></select></label>
    <label>LLM Judge <select id="judgeEnabled"><option value="false">Disabled</option><option value="true">Enabled</option></select></label>
    <label>Judge Mode <select id="judgeMode"><option value="mock">Mock</option><option value="gemini">Gemini</option></select></label>
    <label>Gemini Model <input id="geminiModel" value="${settings.gemini_model||"gemini-3.8-flash"}"></label>
    <label>Gemini API Status <input value="${settings.gemini_configured?"CONFIGURED":"NOT CONFIGURED"}" disabled></label>
  `;
  document.getElementById("dm").value=settings.defense_mode;
  document.getElementById("provider").value=settings.ai_provider||"mock";
  document.getElementById("judgeEnabled").value=String(!!settings.llm_judge_enabled);
  document.getElementById("judgeMode").value=settings.llm_judge||"mock";
}
loadSettings();
document.getElementById("saveSettings").onclick=async()=>{
  await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    RULE_WEIGHT:+rw.value,ML_WEIGHT:+mw.value,LLM_JUDGE_WEIGHT:+jw.value,DEFAULT_DEFENSE_MODE:dm.value,
    AI_PROVIDER:provider.value,LLM_JUDGE_ENABLED:judgeEnabled.value==="true",LLM_JUDGE_MODE:judgeMode.value,
    GEMINI_MODEL:geminiModel.value.trim()
  })});
  loadSettings();
};
document.getElementById("replayIntroBtn").onclick=()=>{localStorage.removeItem("ps_skip_intro");location.href="/?intro=1";};
</script>{% endblock %}
